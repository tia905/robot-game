<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot Game - Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">

        <div>
            <h1>Robot Game</h1>
            <p>Admin Dashboard</p>
        </div>

        <button
            id="create-lesson-button"
            class="primary-button"
        >
            + Create Lesson
        </button>

    </header>


    <main class="admin-main">

        <div class="page-title">

            <h2>My Lessons</h2>

            <p>
                Create and manage your coding game lessons.
            </p>

        </div>


        <div
            id="lesson-list"
            class="lesson-list"
        >

            <!-- Lessons will appear here -->

        </div>

    </main>


    <!-- CREATE LESSON MODAL -->

    <div
        id="lesson-modal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2>
                    Create New Lesson
                </h2>

                <button
                    id="close-modal-button"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <!-- LESSON NAME -->

            <div class="form-group">

                <label for="lesson-title">
                    Lesson Name
                </label>

                <input
                    type="text"
                    id="lesson-title"
                    placeholder="e.g. Robot Adventure"
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="lesson-description">
                    Description
                </label>

                <textarea
                    id="lesson-description"
                    placeholder="Describe this lesson..."
                ></textarea>

            </div>


            <!-- LESSON TYPE -->

            <div class="form-group">

                <label for="lesson-type">
                    Lesson Type
                </label>

                <select id="lesson-type">

                    <option value="sequencing">
                        Sequencing
                    </option>

                    <option value="coordinates">
                        Coordinates
                    </option>

                    <option value="repetition">
                        Repetition
                    </option>

                    <option value="if">
                        If / Else
                    </option>

                </select>

            </div>


            <!-- BACKGROUND -->

            <div class="form-group">

                <label for="lesson-background">
                    Background
                </label>

                <select id="lesson-background">

                    <option value="forest">
                        Forest
                    </option>

                    <option value="space">
                        Space
                    </option>

                    <option value="underwater">
                        Underwater
                    </option>

                    <option value="city">
                        City
                    </option>

                </select>

            </div>


            <!-- NUMBER OF LEVELS -->

            <div class="form-group">

                <label for="lesson-levels">
                    Number of Levels
                </label>

                <input
                    type="number"
                    id="lesson-levels"
                    min="1"
                    max="20"
                    value="8"
                >

            </div>


            <!-- ACTIONS -->

            <div class="modal-actions">

                <button
                    id="cancel-button"
                    class="secondary-button"
                >
                    Cancel
                </button>

                <button
                    id="save-lesson-button"
                    class="primary-button"
                >
                    Create Lesson
                </button>

            </div>

        </div>

    </div>


    <!-- DELETE CONFIRMATION MODAL -->

    <div
        id="delete-modal"
        class="modal hidden"
    >

        <div class="modal-box delete-modal-box">

            <div class="modal-header">

                <h2>
                    Delete Lesson
                </h2>

                <button
                    id="close-delete-modal-button"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <p id="delete-message">
                Are you sure you want to delete this lesson?
            </p>


            <div class="modal-actions">

                <button
                    id="cancel-delete-button"
                    class="secondary-button"
                >
                    Cancel
                </button>

                <button
                    id="confirm-delete-button"
                    class="delete-confirm-button"
                >
                    Delete
                </button>

            </div>

        </div>

    </div>


    <script src="api.js"></script>
    <script src="admin.js"></script>
    <script src="admin-extra.js"></script>

</body>

</html>
