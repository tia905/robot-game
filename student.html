<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Coding Game</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--o:#E8832A;--g:#3FA535;--b:#1B4F9C;--n:#0F2F6B;--bg:#FFF8EC}
*{box-sizing:border-box}
body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--n);min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:5px solid var(--o)}
header b{flex:1;font-size:20px}
main{max-width:960px;margin:0 auto;padding:18px}
button{font-family:inherit;border:0;border-radius:16px;padding:10px 18px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;background:var(--b);box-shadow:0 4px 0 #0f2f6b55}
button:active{transform:translateY(3px);box-shadow:none}
.idt{padding:5px 16px;font-size:18px;background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none}.idt.on{background:#e6f7e3}
body:not(.id-on) .tr{display:none}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 5px 0 #0f2f6b18}
h1,h2{margin:0 0 8px}small{display:block;opacity:.65;font-weight:500;font-size:.72em}small.tr{opacity:.85;color:#4a5f8a;font-size:.8em;line-height:1.3;margin-top:2px}
input,select{font-family:inherit;font-size:18px;padding:10px 12px;border:3px solid #cfdcf3;border-radius:14px;width:100%;margin:6px 0 12px;background:#fff;color:var(--n)}
.login{max-width:440px;margin:30px auto;text-align:center}
.login button,.go{width:100%;background:var(--o);box-shadow:0 4px 0 #a85a14;margin-top:10px}
.bar{height:16px;background:#e6edfa;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.path{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin:26px 0}
.node{width:130px;background:none;color:var(--n);box-shadow:none;padding:0;font-size:16px}
.node span{display:grid;place-items:center;width:92px;height:92px;margin:0 auto 6px;border-radius:50%;font-size:38px;color:#fff;box-shadow:0 7px 0 #0003}
.c0 span{background:var(--o)}.c1 span{background:var(--g)}.c2 span{background:var(--b)}
.node small{font-size:.8em;opacity:.8}.node.locked{opacity:.45;filter:grayscale(.7)}.node.locked span{background:#8a94a6!important}
.lo{padding:4px 12px;font-size:15px;background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none;margin-top:10px}
.rv{padding:10px 12px;margin:8px 0;border-radius:14px;background:#f7f9ff;border:3px solid #dbe4f5}.rv.g{border-color:var(--g);background:#e6f7e3}.rv.b{border-color:#e0483e;background:#fdeceb}.rv i{display:block;margin-top:4px}
.done{text-align:center;font-size:24px;font-weight:800;color:var(--g)}
.steps{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.steps i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#dbe4f5;font-style:normal;font-weight:800}
.steps .ok{background:var(--g);color:#fff}.steps .cur{background:var(--o);color:#fff}
.steps .back{padding:4px 12px;margin-right:10px}.st{margin-left:10px;font-weight:800}
.qa{display:grid;gap:14px}.q img{max-width:100%;max-height:240px;display:block;margin:0 auto 10px;border-radius:14px}.q h2{font-size:24px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border:4px solid #dbe4f5;border-radius:18px;cursor:pointer;background:#fff}
.opt img{max-height:90px;border-radius:10px}.opt b{width:24px;height:24px;border:3px solid var(--b);border-radius:7px;flex:none}.opt b.rb{border-radius:50%}
.opt.sel{border-color:var(--b);background:#e8f0ff}.opt.sel b{background:var(--b)}
.right{border-color:var(--g)!important;background:#e6f7e3!important}.wrong{border-color:#e0483e!important;background:#fdeceb!important}
.dp{line-height:2.1}.dp select{width:auto;display:inline-block;margin:0 4px;padding:4px 8px}
.mx{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}@media(max-width:560px){.mx{gap:44px}.m{padding:10px 8px;font-size:16px}.card{padding:16px}.node{width:110px}}.mx svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.m{position:relative;padding:12px;margin:8px 0;border:4px solid #dbe4f5;border-radius:16px;cursor:pointer;text-align:center;background:#fff;touch-action:none;user-select:none}.m.sel{background:#fff1e0;border-color:var(--o)}
.m.l::after,.m.r::before{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #8a94a6;transform:translateY(-50%);z-index:4}.m.l::after{right:-13px}.m.r::before{left:-13px}
.cd{touch-action:none;user-select:none;-webkit-user-select:none}.cd img{display:block;max-width:130px;max-height:80px;margin:0 auto 4px;border-radius:8px;pointer-events:none}
.cd.dragging{opacity:.35}.cd.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 8px 20px #0004;text-align:center}
.pool{min-height:64px;padding:8px;border:3px dashed #e3d3b8;border-radius:16px;background:#fffdf8}
.slot.wrong,.dz.wrong{border-color:#e0483e!important;background:#fdeceb!important}.dz.right{border-color:var(--g)!important;background:#e6f7e3!important}
.dzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.dz{padding:8px;border:3px dashed #9db4e0;border-radius:16px;min-height:120px;background:#fff;text-align:center}.dz.sel{border-color:var(--o);background:#fff6ea}
.dzl{font-weight:800;margin-bottom:6px}.dzl img{display:block;max-width:100%;max-height:90px;margin:0 auto 4px;border-radius:8px}.dzb{min-height:52px;display:grid;place-items:center}.dzb .cd{margin:0}.ph{opacity:.35;font-size:26px}
.fix{margin-top:6px;font-size:14px;font-weight:700;color:#2a7a22}.fix img{max-height:48px;display:block;margin:0 auto}
.sl{display:block;font-weight:800;margin:12px 0 4px}.tk{width:100%;font:inherit;font-size:18px;padding:12px;border:3px solid #cfdcf3;border-radius:14px;background:#fff}.stl .ti{width:100%;margin:0}.addst{margin-top:12px;font:inherit;font-weight:800;padding:10px 16px;border:3px dashed #cfdcf3;border-radius:14px;background:#fff;color:#1d4a8a;cursor:pointer}
.ta{font-family:inherit;font-size:18px;padding:10px 12px;border:3px solid #cfdcf3;border-radius:14px;width:100%;margin:6px 0}
.trow{text-align:center;margin:-6px 0 12px}.trow:empty{display:none}.tries{display:inline-block;padding:3px 12px;background:#fff1e0;border:3px solid var(--o);border-radius:14px;font-weight:800;font-size:16px}
.slots,.pool{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.slot{min-width:130px;min-height:70px;padding:6px;border:3px dashed #9db4e0;border-radius:16px;position:relative;cursor:pointer}.slot.sel{border-color:var(--o);background:#fff6ea}
.slot small{position:absolute;top:2px;left:8px}
.cd{padding:10px 14px;background:#fff1e0;border:3px solid var(--o);border-radius:14px;cursor:pointer;font-weight:700}.slot .cd{margin-top:14px}
.add{background:var(--g);box-shadow:0 4px 0 #2a7a22;font-size:16px;padding:6px 14px}
.lock{pointer-events:none}#fb{text-align:center;font-size:22px;font-weight:800;margin:10px 0 0}#fb.good{color:var(--g)}#fb.bad{color:#d03a30}
body{background-image:radial-gradient(#f3c98b66 2px,transparent 2px);background-size:26px 26px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.mascot{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0}.mascot img{height:110px;width:auto;animation:bob 1.6s ease-in-out infinite}
.mascot p{margin:0;background:#fff;border:4px solid var(--o);border-radius:22px;padding:10px 18px;font-weight:800;font-size:20px}
.node{transition:transform .2s}.node:hover{transform:translateY(-6px) rotate(-3deg)}.node.next span{animation:pulse 1.2s infinite;outline:7px solid #ffd9a8}
.card{border:4px solid #ffe2bd}.opt{transition:transform .15s}.opt:hover{transform:scale(1.02)}.shake{animation:shake .4s}
.cf{position:fixed;top:-30px;font-size:30px;pointer-events:none;z-index:99;animation:fall 2s linear forwards}
header b::before{content:"🤖 "}.steps i{width:42px;height:42px;font-size:18px}.go{font-size:22px;padding:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="api.js"></script>
<script>
const CLASSES = ["G4 Torenia", "G4 Evodia", "G4 Lasiandra", "G4 Salvia"]; // ubah daftar kelas di sini
const P = new URLSearchParams(location.search), LID = P.get("lesson"), app = document.getElementById("app");
let S = JSON.parse(localStorage.getItem("robotStudent") || sessionStorage.getItem("robotStudent") || "null"), L = null, view = null, lang = localStorage.getItem("robotLang") || "en";
const save = () => localStorage.setItem("robotStudent", JSON.stringify(S));
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const raw = o => (o && (o.en || o.id)) || "";
// English selalu jadi teks utama; terjemahan Indonesia ada di bawahnya (disembunyikan sampai tombol ID ditekan)
const T = o => { if (!o) return ""; if (typeof o === "string") return esc(o); const en = o.en || "", id = o.id || ""; return en && id ? `${esc(en)}<small class="tr">${esc(id)}</small>` : esc(en || id); };
const UI = {
  start: { en: "START", id: "MULAI" }, name: { en: "Your name", id: "Nama kamu" }, cls: { en: "Choose your class", id: "Pilih kelas" },
  hello: { en: "Hello", id: "Halo" }, check: { en: "CHECK", id: "PERIKSA" }, next: { en: "NEXT", id: "LANJUT" }, finish: { en: "FINISH", id: "SELESAI" },
  good: { en: "Great job! 🎉", id: "Hebat! 🎉" }, bad: { en: "Not quite. Keep learning! 💪", id: "Belum tepat. Terus belajar! 💪" }, saved: { en: "Answer saved ✅", id: "Jawaban tersimpan ✅" },
  ans: { en: "Please answer first.", id: "Jawab dulu ya." }, all: { en: "All done!", id: "Semua selesai!" }, addbox: { en: "+ Add box", id: "+ Tambah kotak" },
  type: { en: "Type your answer", id: "Ketik jawabanmu" }, mytask: { en: "My task", id: "Tugasku" }, pickTask: { en: "Choose a task", id: "Pilih tugas" }, step: { en: "Step", id: "Langkah" }, addstep: { en: "+ Add step", id: "+ Tambah langkah" }, fill: { en: "Fill in your name and class first.", id: "Isi nama dan kelas dulu ya." },
  err: { en: "Lesson not found. Ask your teacher for a new link.", id: "Lesson tidak ditemukan. Minta link baru ke gurumu." }, load: { en: "Loading...", id: "Memuat..." },
  locked: { en: "Finish the previous challenge first 🔒", id: "Selesaikan challenge sebelumnya dulu 🔒" },
  sw: { en: "Not you? Change name", id: "Bukan kamu? Ganti nama" }, retry: { en: "TRY AGAIN", id: "ULANGI" },
  sure: { en: "Start this quiz again? Your old answers will be replaced.", id: "Ulangi quiz ini? Jawaban lama akan diganti." },
  retry2: { en: "Not quite. Try again! 💪", id: "Belum tepat. Coba lagi! 💪" }, chances: { en: "Chances left", id: "Sisa kesempatan" }, manual: { en: "Answer saved. Your teacher will check it ✅", id: "Jawaban tersimpan. Gurumu yang akan memeriksa ✅" }, bonus: { en: "bonus", id: "bonus" }
};
const U = k => T(UI[k]), msg = k => lang === "id" ? UI[k].id + "\n" + UI[k].en : UI[k].en, plain = k => lang === "id" ? UI[k].id : UI[k].en;
const send = items => api("submit", { lessonId: L.id, lessonTitle: L.title, name: S.name, cls: S.cls, plan: lessonPlan(L), items }).catch(() => {});
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COL = ["#E8832A", "#3FA535", "#1B4F9C", "#C2398B", "#00A3A3", "#8A5CF6", "#D4A017", "#E0483E"];

function confetti() { const e = ["⭐", "🎉", "✨", "🌟", "🎈"]; for (let i = 0; i < 28; i++) { const s = document.createElement("span"); s.className = "cf"; s.textContent = e[i % 5]; s.style.left = Math.random() * 100 + "vw"; s.style.animationDelay = Math.random() * .4 + "s"; document.body.appendChild(s); setTimeout(() => s.remove(), 2800); } }
function norm(q) {
  if (q.type) return q;
  return { type: "choice", q: { en: q.q || "", id: "" }, img: q.img || "", options: (q.options || []).map((o, k) => ({ t: { en: o.text || "", id: "" }, img: o.img || "", ok: k === q.correct })) };
}

// ---- drag & drop (mouse + sentuh) ----
function dnd(root, o) {
  let d = null;
  root.addEventListener("pointerdown", e => {
    const c = e.target.closest(o.chip);
    if (!c || !root.contains(c) || root.classList.contains("lock")) return;
    d = { c, x: e.clientX, y: e.clientY, g: null, id: e.pointerId };
    try { c.setPointerCapture(e.pointerId); } catch (x) {}
  });
  root.addEventListener("pointermove", e => {
    if (!d || e.pointerId !== d.id) return;
    if (!d.g && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) {
      const r = d.c.getBoundingClientRect();
      d.g = d.c.cloneNode(true); d.g.classList.add("ghost"); d.g.style.width = r.width + "px"; document.body.appendChild(d.g); d.c.classList.add("dragging");
    }
    if (d.g) { d.g.style.left = e.clientX + "px"; d.g.style.top = e.clientY + "px"; }
  });
  const end = e => {
    if (!d || e.pointerId !== d.id) return;
    const x = d; d = null; const up = e.type === "pointerup";
    if (x.g) {
      x.g.style.display = "none"; const el = document.elementFromPoint(e.clientX, e.clientY); x.g.remove(); x.c.classList.remove("dragging");
      if (up) o.drop(x.c, el && el.closest(o.zone));
    } else if (up) o.tap(x.c);
  };
  root.addEventListener("pointerup", end); root.addEventListener("pointercancel", end);
}
const chipHTML = (t, img, attrs) => `<div class="cd" ${attrs}>${img ? `<img src="${esc(img)}" draggable="false">` : ""}${T(t)}</div>`;

const TYPES = {
  choice: {
    draw: q => { const m = isMulti(q); return q.options.map((o, k) => `<div class="opt" data-k="${k}"><b class="${m ? "" : "rb"}"></b>${o.img ? `<img src="${esc(o.img)}">` : ""}<span>${T(o.t)}</span></div>`).join(""); },
    bind: (r, q) => {
      const sel = new Set(), multi = isMulti(q), els = r.querySelectorAll(".opt");
      els.forEach(el => el.onclick = () => { const k = +el.dataset.k; if (!multi) sel.clear(); sel.has(k) ? sel.delete(k) : sel.add(k); els.forEach(x => x.classList.toggle("sel", sel.has(+x.dataset.k))); });
      return {
        get: () => ({ done: sel.size > 0, ok: q.options.every((o, k) => !!o.ok === sel.has(k)), text: [...sel].map(k => raw(q.options[k].t) || "picture " + (k + 1)).join(", ") }),
        show: () => els.forEach(el => { const k = +el.dataset.k; el.classList.remove("sel"); if (q.options[k].ok) el.classList.add("right"); else if (sel.has(k)) el.classList.add("wrong"); }),
        soft: () => { sel.clear(); els.forEach(x => x.classList.remove("sel")); }
      };
    }
  },
  text: {
    draw: () => `<input class="ti" data-ph="type" placeholder="${esc(plain("type"))}">`,
    bind: (r, q) => {
      const i = r.querySelector(".ti"), acc = (q.answers || "").split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
      return { get: () => ({ done: !!i.value.trim(), ok: acc.length ? acc.includes(i.value.trim().toLowerCase()) : null, text: i.value.trim() }), show: () => { i.disabled = true; }, soft: () => { i.focus(); i.select(); } };
    }
  },
  steps: {
    draw: q => {
      const n = Math.max(2, Math.min(15, Math.floor(+q.count) || 5)), tk = q.tasks || [];
      return `<label class="sl">${esc(plain("mytask"))}</label><select class="tk"><option value="">${esc(plain("pickTask"))}</option>${tk.map((t, i) => `<option value="${i}">${esc(lang === "id" && t.id ? t.id : t.en)}</option>`).join("")}</select><div class="stl">${Array.from({ length: n }, (_, i) => `<label class="sl">${esc(plain("step"))} ${i + 1}</label><input class="ti stp">`).join("")}</div><button type="button" class="addst">${esc(plain("addstep"))}</button>`;
    },
    bind: (r, q) => {
      const sel = r.querySelector(".tk"), box = r.querySelector(".stl"), btn = r.querySelector(".addst");
      btn.onclick = () => {
        const k = box.querySelectorAll(".stp").length; if (k >= 15) return;
        box.insertAdjacentHTML("beforeend", `<label class="sl">${esc(plain("step"))} ${k + 1}</label><input class="ti stp">`);
        box.lastElementChild.focus(); if (k + 1 >= 15) btn.style.display = "none";
      };
      return {
        get: () => {
          const st = [...box.querySelectorAll(".stp")].map(i => i.value.trim()).filter(Boolean), t = sel.value === "" ? null : q.tasks[+sel.value];
          const task = t ? (raw(t)) : "";
          return { done: sel.value !== "" && st.length > 0, ok: null, text: task + "\n" + st.map((s, i) => (i + 1) + ". " + s).join("\n") };
        },
        show: () => { sel.disabled = true; box.querySelectorAll(".stp").forEach(i => i.disabled = true); btn.style.display = "none"; }
      };
    }
  },
  essay: {
    draw: () => `<textarea class="ta" rows="5" data-ph="type" placeholder="${esc(plain("type"))}"></textarea>`,
    bind: r => {
      const i = r.querySelector(".ta");
      return { get: () => ({ done: !!i.value.trim(), ok: null, text: i.value.trim() }), show: () => { i.disabled = true; } };
    }
  },
  dropdown: {
    own: 1,
    draw: q => {
      q._sh = q.blanks.map(b => shuffle(b.opts.split(",").map(s => s.trim()).filter(Boolean))); let n = 0;
      const main = q.q.en || q.q.id, sub = q.q.en && q.q.id ? q.q.id : "";
      return `<h2 class="dp">${esc(main).replace(/___/g, () => `<select><option value="">?</option>${(q._sh[n++] || []).map(o => `<option>${esc(o)}</option>`).join("")}</select>`)}</h2>${sub ? `<small class="tr">${esc(sub).replace(/___/g, "____")}</small>` : ""}`;
    },
    bind: (r, q) => {
      const ss = [...r.querySelectorAll("select")], key = i => q.blanks[i].opts.split(",")[0].trim();
      return {
        get: () => ({ done: ss.every(s => s.value), ok: ss.every((s, i) => s.value === key(i)), text: ss.map(s => s.value).join(" | ") }),
        show: () => ss.forEach((s, i) => { s.disabled = true; s.classList.add(s.value === key(i) ? "right" : "wrong"); }),
        soft: () => ss.forEach((s, i) => { if (s.value !== key(i)) s.value = ""; })
      };
    }
  },
  match: {
    draw: q => `<div class="mx"><svg class="ml"></svg><div class="mc">${q.pairs.map((p, i) => `<div class="m l" data-i="${i}">${T(p.l)}</div>`).join("")}</div><div class="mc">${shuffle(q.pairs.map((_, i) => i)).map(i => `<div class="m r" data-i="${i}">${T(q.pairs[i].r)}</div>`).join("")}</div></div>`,
    bind: (r, q) => {
      const mx = r.querySelector(".mx"), svg = mx.querySelector("svg"), Ls = [...r.querySelectorAll(".m.l")], Rs = [...r.querySelectorAll(".m.r")];
      const byI = (a, i) => a.find(e => +e.dataset.i === i), G = "#3FA535", Rd = "#e0483e";
      let pair = {}, cur = null, rub = null, verdict = false, reveal = false, down = null;
      const pt = (el, side) => { const a = mx.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: (side === "L" ? b.right : b.left) - a.left, y: b.top + b.height / 2 - a.top }; };
      const ln = (a, b, col, dash) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="5" stroke-linecap="round"${dash ? ' stroke-dasharray="1 10"' : ""}/>`;
      const colOf = i => verdict ? (pair[i] === +i ? G : Rd) : COL[i % 8];
      const paint = () => {
        let h = "";
        Object.keys(pair).forEach(i => { h += ln(pt(byI(Ls, +i), "L"), pt(byI(Rs, pair[i]), "R"), colOf(i)); });
        if (reveal) Object.keys(pair).forEach(i => { if (pair[i] !== +i) h += ln(pt(byI(Ls, +i), "L"), pt(byI(Rs, +i), "R"), G, true); });
        if (rub) h += ln(rub.a, rub.b, "#8a94a6", true);
        svg.innerHTML = h;
        Ls.forEach(e => { const i = +e.dataset.i; e.style.borderColor = pair[i] != null ? colOf(i) : ""; e.classList.toggle("sel", !!cur && cur.side === "L" && cur.i === i); });
        Rs.forEach(e => { const j = +e.dataset.i, i = Object.keys(pair).find(k => pair[k] === j); e.style.borderColor = i != null ? colOf(i) : ""; e.classList.toggle("sel", !!cur && cur.side === "R" && cur.i === j); });

      r.addEventListener("pointerdown", ev => {
        const e = ev.target.closest(".m"); if (!e || r.classList.contains("lock")) return;

  order: {

    bind: (r, q) => {
      const n = q.cards.length, cards = shuffle(q.cards.map((c, i) => ({ t: c.t, i })).concat((q.extras || []).map(c => ({ t: c.t, i: -1 })))), slots = Array(n).fill(null), bad = new Set();
      let sel = null; const sl = r.querySelector(".slots"), po = r.querySelector(".pool");
      const paint = () => {
        sl.innerHTML = slots.map((c, k) => `<div class="slot${sel === k ? " sel" : ""}${bad.has(k) ? " wrong" : ""}" data-k="${k}"><small>${k + 1}</small>${c ? `<div class="cd" data-s="${k}">${T(c.t)}</div>` : ""}</div>`).join("");

        soft: () => { slots.forEach((c, k) => { if (c && c.i !== k) bad.add(k); }); paint(); setTimeout(() => { bad.forEach(k => { slots[k] = null; }); bad.clear(); paint(); }, 900); }

  dragdrop: {

};
const isMulti = q => q.mode ? q.mode === "multi" : q.options.filter(o => o.ok).length > 1;

function applyLang() {
  const on = lang === "id";
  document.body.classList.toggle("id-on", on);
  document.querySelectorAll(".idt").forEach(b => { b.textContent = on ? "ID ✓" : "ID"; b.classList.toggle("on", on); });
  document.querySelectorAll("[data-ph]").forEach(e => { const t = plain(e.dataset.ph); if (e.tagName === "OPTION") e.textContent = t; else e.placeholder = t; });
}
function shell(inner, lg) {
  app.innerHTML = `<header><b>Robot Coding Game</b>${lg ? `<button class="idt" type="button"></button>` : ""}</header><main>${inner}</main>`;
  app.querySelectorAll(".idt").forEach(b => b.onclick = () => { lang = lang === "id" ? "en" : "id"; localStorage.setItem("robotLang", lang); applyLang(); });
  applyLang();
}

function prep() {
  if (!L.challenges || !L.challenges.length) L.challenges = [{ type: "game", title: "Game" }];
  L.challenges.forEach(c => { if (c.type === "quiz") c.questions = c.questions.map(norm); });
}
async function fetchLesson() {
  const r = await apiGet("getLesson", { id: LID }); if (!r.ok) throw 0;
  L = r.lesson; localStorage.setItem("lesson_" + LID, JSON.stringify(L)); sessionStorage.setItem("robotStudentLesson", JSON.stringify(L)); prep();
}
async function init() {
  if (!LID) { shell(`<div class="card"><h2>Invalid link</h2></div>`); return; }
  const c = localStorage.getItem("lesson_" + LID);
  if (c) { L = JSON.parse(c); sessionStorage.setItem("robotStudentLesson", c); prep(); begin(); fetchLesson().catch(() => {}); return; }
  // Belum ada cache (kunjungan pertama): tampilkan form nama/kelas SEKARANG, lesson dimuat di latar belakang
  const pending = fetchLesson();
  const saved = S && S.lesson === LID && S.name;
  if (!saved) shell(`<div class="card login"><h1>⏳</h1><p>${U("load")}</p>
    <input id="n" data-ph="name" placeholder="${esc(plain("name"))}"><select id="k"><option value="" data-ph="cls">${esc(plain("cls"))}</option>${CLASSES.map(c => `<option>${c}</option>`).join("")}</select><button id="go" disabled>…</button></div>`, true);
  else shell(`<div class="card"><h2>⏳ ${U("load")}</h2></div>`, true);
  try {
    await pending;
    const n0 = document.getElementById("n"), k0 = document.getElementById("k"), nv = n0 ? n0.value : "", kv = k0 ? k0.value : "";
    begin();
    const n1 = document.getElementById("n"), k1 = document.getElementById("k");
    if (n1 && nv) n1.value = nv; if (k1 && kv) k1.value = kv;
  } catch (e) { shell(`<div class="card"><h2>${U("err")}</h2></div>`); }
}
// ---- progress tersimpan di browser (per murid: nama + kelas) ----
const cidOf = (c, i) => c.cid || "i" + i;
const nLv = () => Math.max(1, (L.levels || []).length);
const bonusN = () => Math.max(0, Math.min(nLv() - 1, Math.floor(+L.bonusLevels || 0)));
const readJ = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const quizSig = c => c.questions.map(q => raw(q.q) || "").join("|");
function stat(c, i) {
  if (c.type === "game") {
    const p = readJ(progKey(LID, S, "Game")), comp = p ? (p.completed || []).map(Number) : [], reg = nLv() - bonusN(), b = bonusN();
    const dr = comp.filter(n => n >= 1 && n <= reg).length, db = comp.filter(n => n > reg && n <= nLv()).length;
    return { done: dr >= reg, txt: `${dr}/${reg}` + (b ? ` · ⭐ ${db}/${b}` : "") };
  }
  const p = readJ(progKey(LID, S, "Quiz" + cidOf(c, i))), tot = c.questions.length, n = p && p.sig === quizSig(c) ? Object.keys(p.res || {}).length : 0;
  return { done: n >= tot && tot > 0, txt: `${n}/${tot}` };
}
function begin() {
  if (!S || S.lesson !== LID || !S.name) { showLogin(); return; }
  history.replaceState(null, "", "student.html?lesson=" + encodeURIComponent(LID));
  showHub();
}
function showLogin() {
  view = showLogin;
  shell(`<div class="card login"><h1>${esc(L.title)}</h1><p>${esc(L.description || "")}</p>
    <input id="n" data-ph="name" placeholder="${esc(plain("name"))}"><select id="k"><option value="" data-ph="cls">${esc(plain("cls"))}</option>${CLASSES.map(c => `<option>${c}</option>`).join("")}</select><button id="go">${U("start")}</button></div>`, true);
  document.getElementById("go").onclick = () => {
    const n = document.getElementById("n").value.trim(), k = document.getElementById("k").value;
    if (!n || !k) { alert(msg("fill")); return; }
    S = { lesson: LID, name: n, cls: k }; save(); showHub();
  };
}
function showHub() {
  view = showHub;
  const st = L.challenges.map(stat), n = L.challenges.length, got = st.filter(x => x.done).length;
  const lockedAt = i => !!L.lockOrder && st.slice(0, i).some(x => !x.done);
  const nextI = L.challenges.findIndex((_, k) => !st[k].done && !lockedAt(k));
  shell(`<div class="card"><h1>Hello, ${esc(S.name)}! 👋<small class="tr">Halo, ${esc(S.name)}!</small></h1><div>${esc(L.title)} • ${esc(S.cls)}</div><div class="bar"><i style="width:${got / n * 100}%"></i></div><button class="lo" id="lo" type="button">↩ ${esc(plain("sw"))}</button></div>
    <div class="mascot"><img src="assets/tunas-unggul.webp" alt="Tunas Unggul" width="100" height="110"><p>${T({ en: "Let's finish the missions! 🚀", id: "Ayo selesaikan misinya!" })}</p></div><div class="path">${L.challenges.map((c, i) => { const lk = lockedAt(i); return `<button class="node c${i % 3}${i === nextI ? " next" : ""}${lk ? " locked" : ""}" data-i="${i}"><span>${lk ? "🔒" : st[i].done ? "⭐" : c.type === "game" ? "🤖" : i + 1}</span>${esc(c.title)}<small>${st[i].txt}</small></button>`; }).join("")}</div>${got === n ? `<p class="done">🎉 ${U("all")}</p>` : ""}`, true);
  document.getElementById("lo").onclick = () => { S = null; localStorage.removeItem("robotStudent"); sessionStorage.removeItem("robotStudent"); showLogin(); };
  app.querySelectorAll(".node").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, c = L.challenges[i];
    if (lockedAt(i)) { alert(msg("locked")); return; }
    if (c.type === "game") location.href = "index.html?lesson=" + encodeURIComponent(LID) + "&student=1"; else startQuiz(i);
  });
}
function startQuiz(ci) {
  const c = L.challenges[ci], Q = c.questions, key = progKey(LID, S, "Quiz" + cidOf(c, ci)), sig = quizSig(c);
  let PR = readJ(key); if (!PR || PR.sig !== sig || !PR.res) PR = { sig, res: {} }; if (!PR.tries) PR.tries = {};
  const label = lessonPlan(L)[ci].label, max = Math.max(1, Math.min(10, Math.floor(+c.attempts || 1)));
  const persist = () => { try { localStorage.setItem(key, JSON.stringify(PR)); } catch (e) {} };
  const stars = () => Object.values(PR.res).filter(r => r.ok === true).length;
  let qi = Q.findIndex((_, k) => !PR.res[k]);
  const review = () => {
    view = null;
    shell(`<div class="steps"><button class="back" id="bk">←</button><span class="st">⭐ ${stars()} / ${Q.length}</span></div>
      <div class="card"><h2>${esc(c.title)} ✅</h2>${Q.map((q, k) => { const r = PR.res[k] || {}; return `<div class="rv ${r.ok === true ? "g" : r.ok === false ? "b" : ""}"><b>${k + 1}.</b> ${T(q.q)}<i>${esc(r.text)} ${r.ok === true ? "✅" : r.ok === false ? "❌" : "📝"}</i></div>`; }).join("")}</div>
      <button class="go" id="rt">${U("retry")}</button>`, true);
    document.getElementById("bk").onclick = showHub;
    document.getElementById("rt").onclick = () => { if (!confirm(msg("sure"))) return; PR = { sig, res: {}, tries: {} }; persist(); startQuiz(ci); };
  };
  if (qi < 0) { review(); return; }
  const draw = () => {
    view = null; const q = Q[qi], ty = TYPES[q.type] || TYPES.choice, last = qi === Q.length - 1; let locked = false;
    let tries = Math.min(PR.tries[qi] || 0, max - 1);
    const left = () => max > 1 ? `<span class="tries">🎯 ${esc(plain("chances"))}: ${max - tries}/${max}</span>` : "";
    shell(`<div class="steps"><button class="back" id="bk">←</button>${Q.map((_, k) => `<i class="${k < qi ? "ok" : k === qi ? "cur" : ""}">${k < qi ? "✓" : k + 1}</i>`).join("")}<span class="st">⭐ ${stars()}</span></div><div class="trow" id="tr2">${left()}</div>
      <div class="qa">${q.img || !ty.own ? `<div class="card q">${q.img ? `<img src="${esc(q.img)}">` : ""}${ty.own ? "" : `<h2>${T(q.q)}</h2>`}</div>` : ""}
      <div class="card" id="area">${ty.draw(q)}</div></div><div id="fb"></div><button class="go" id="go">${U("check")}</button>`, true);
    const area = document.getElementById("area"), h = ty.bind(area, q), go = document.getElementById("go"), fb = document.getElementById("fb");
    document.getElementById("bk").onclick = showHub;
    go.onclick = () => {
      if (locked) { if (!last) { qi++; draw(); } else { showHub(); } return; }
      const r = h.get(); if (!r.done) { alert(msg("ans")); return; }
      tries++; PR.tries[qi] = tries;
      const fin = r.ok !== false || tries >= max;
      const item = { challenge: label, kind: "quiz", no: qi + 1, question: raw(q.q), answer: r.text, status: r.ok === true ? "benar" : r.ok === false ? "salah" : "tidak dinilai", score: r.ok === true ? 1 : r.ok === false ? 0 : "", attempt: tries };
      if (!fin) {
        area.classList.add("shake"); setTimeout(() => area.classList.remove("shake"), 500);
        fb.className = "bad"; fb.innerHTML = U("retry2"); document.getElementById("tr2").innerHTML = left();
        if (h.soft) h.soft();
        persist(); send([item]); return;
      }
      locked = true; area.classList.add("lock"); h.show(); if (r.ok) confetti(); else if (r.ok === false) area.classList.add("shake");
      PR.res[qi] = { ok: r.ok, text: r.text, tries }; persist();
      fb.className = r.ok === false ? "bad" : "good"; fb.innerHTML = r.ok === true ? U("good") : r.ok === false ? U("bad") : U("manual");
      document.getElementById("tr2").innerHTML = left();
      go.innerHTML = last ? U("finish") : U("next");
      send([item]);
    };
  };
  draw();
}
