<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback Teman</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--o:#E8832A;--g:#3FA535;--b:#1B4F9C;--n:#0F2F6B;--bg:#FFF8EC}
*{box-sizing:border-box}
body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--n);min-height:100vh;background-image:radial-gradient(#f3c98b66 2px,transparent 2px);background-size:26px 26px}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:5px solid var(--o)}
header b{flex:1;font-size:20px}
main{max-width:760px;margin:0 auto;padding:18px}
button,.btn{font-family:inherit;border:0;border-radius:16px;padding:10px 18px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;background:var(--b);box-shadow:0 4px 0 #0f2f6b55;text-decoration:none;display:inline-block}
button:active{transform:translateY(3px);box-shadow:none}button[disabled]{opacity:.45;cursor:not-allowed}
.go{width:100%;background:var(--o);box-shadow:0 4px 0 #a85a14;margin-top:6px}
.lo{padding:4px 12px;font-size:15px;background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 5px 0 #0f2f6b18;border:4px solid #ffe2bd;margin-bottom:14px}
h1,h2{margin:0 0 8px}small{opacity:.7}
select{font-family:inherit;font-size:18px;padding:10px 12px;border:3px solid #cfdcf3;border-radius:14px;width:100%;margin:6px 0 12px;background:#fff;color:var(--n)}
label.l{font-weight:800;display:block;margin-top:4px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none;font-size:17px}.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.fbk{background:#f7f9ff;border:3px solid #dbe4f5;border-radius:16px;padding:12px 14px;margin:10px 0}.fbk p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:18px}.fbk small{font-weight:700}
.empty{text-align:center;padding:20px;opacity:.8}
.msg{font-weight:800;margin:8px 0}.msg.good{color:var(--g)}.msg.bad{color:#d03a30}
/* ---- viewer layar penuh ---- */
.vw{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--n);z-index:50}
.vt{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:#fff;border-bottom:4px solid var(--o)}
.vt b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt button,.vt .btn{padding:6px 12px;font-size:15px;border-radius:12px}
.vt .alt{background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none}
.vb{flex:1;display:flex;min-height:0}
.stage{flex:1;background:#111;position:relative;min-width:0;display:flex;align-items:center;justify-content:center}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.nop{max-width:420px;text-align:center;color:#fff;padding:20px}.nop h2{color:#fff}.nop .btn{background:var(--o);box-shadow:0 4px 0 #a85a14}
.pn{width:340px;flex:none;background:#fff;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.pn p{margin:0;font-size:15px;line-height:1.35}
.pn textarea{font-family:inherit;font-size:17px;padding:10px 12px;border:3px solid #cfdcf3;border-radius:14px;width:100%;min-height:90px;resize:vertical;color:var(--n)}
.pn .cnt{font-size:13px;opacity:.65;text-align:right}
.mob{display:none}
.ql{font-weight:800;display:block;margin-top:6px;font-size:16px}
.stars{display:flex;gap:4px;margin:4px 0}.stars button{padding:2px 8px;font-size:26px;background:#fff;color:#c9d3e6;box-shadow:none;border:3px solid #dbe4f5;border-radius:12px}.stars button.on{color:#f5a623;border-color:#f5a623;background:#fff8e1}
.chs{display:grid;gap:6px;margin:4px 0}.chs button{text-align:left;background:#fff;color:var(--n);border:3px solid #dbe4f5;box-shadow:none;font-size:16px;padding:8px 12px;border-radius:14px}.chs button.on{border-color:var(--b);background:#e8f0ff}
.idt{padding:4px 14px;font-size:16px;background:#fff;color:var(--n);border:3px solid var(--n);box-shadow:none;border-radius:14px}.idt.on{background:#e6f7e3}
.fbk .ql{font-size:14px;opacity:.8;margin-top:8px}.fbk .st{font-size:22px}
@media(max-width:800px){.vb{flex-direction:column}.pn{width:auto;max-height:46vh}.pn.min{display:none}.mob{display:inline-block}.pn textarea{min-height:90px}}
.cf{position:fixed;top:-30px;font-size:30px;pointer-events:none;z-index:99;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="api.js"></script>
<script>
const P = new URLSearchParams(location.search), LID = P.get("lesson"), app = document.getElementById("app");
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const readJ = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const writeJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const K = (cls, no) => cls + "|" + no;
let SU = null, L = null, CH = null, view = null, lang = localStorage.getItem("robotLang") || "en";
let ME = readJ("fbMe_" + LID), GIVEN = readJ("fbGiven_" + LID) || {}, tab = "give", pickCls = "";

const UI = {
  title: { en: "Friend Feedback", id: "Feedback Teman" }, hello: { en: "Hello! 👋", id: "Halo! 👋" },
  pickWho: { en: "Choose your class and your name first.", id: "Pilih kelas dan namamu dulu ya." },
  cls: { en: "Class", id: "Kelas" }, nm: { en: "Roll number & name", id: "Nomor absen & nama" },
  selCls: { en: "— choose class —", id: "— pilih kelas —" }, selNm: { en: "— choose name —", id: "— pilih nama —" },
  start: { en: "START", id: "MULAI" }, fillWho: { en: "Choose your class and name first.", id: "Pilih kelas dan namamu dulu ya." },
  hi: { en: "Hi", id: "Hai" }, notMe: { en: "↩ Not you? Change", id: "↩ Bukan kamu? Ganti" }, back: { en: "← Lesson", id: "← Lesson" },
  tGive: { en: "✍️ Give feedback", id: "✍️ Beri feedback" }, tMine: { en: "📬 For me", id: "📬 Untukku" },
  pickProj: { en: "Choose a friend's project", id: "Pilih project temanmu" }, open: { en: "▶ OPEN PROJECT", id: "▶ BUKA PROJECT" },
  doneNote: { en: "✓ = you already gave feedback to this friend.", id: "Tanda ✓ = kamu sudah memberi feedback ke teman itu." },
  mineTitle: { en: "Feedback for your project", id: "Feedback untuk project-mu" }, reload: { en: "🔄 Reload", id: "🔄 Muat ulang" },
  none: { en: "No feedback yet. Be patient, your friends will write some 😊", id: "Belum ada feedback. Sabar ya, nanti temanmu akan menulisnya 😊" },
  loadErr: { en: "Could not load. Check your internet and press Reload.", id: "Belum bisa memuat. Periksa internet lalu tekan Muat ulang." },
  you: { en: "(you)", id: "(kamu)" }, friend: { en: "Your friend", id: "Temanmu" }, loading: { en: "Loading...", id: "Memuat..." },
  notOpen: { en: "Feedback is not open yet 🙈", id: "Feedback belum dibuka 🙈" }, notOpen2: { en: "Ask your teacher for a new link, or try again later.", id: "Minta link baru ke gurumu, atau coba lagi nanti." },
  full: { en: "⛶ Fullscreen", id: "⛶ Layar penuh" }, newtab: { en: "Open in new tab", id: "Buka di tab baru" },
  noEmbed: { en: "This project can't open inside the page 🌐", id: "Project ini tidak bisa dibuka di dalam halaman 🌐" },
  noEmbed2: { en: "Open it in a new tab, then come back here to write your feedback.", id: "Buka di tab baru, lalu kembali ke sini untuk menulis feedback." },
  openProj: { en: "Open project ↗", id: "Buka project ↗" }, noSub: { en: "hasn't submitted a project yet 🙈", id: "belum mengumpulkan project 🙈" },
  pickOther: { en: "Pick another friend first.", id: "Pilih teman yang lain dulu ya." },
  fbFor: { en: "Feedback for", id: "Feedback untuk" }, send: { en: "📨 SEND FEEDBACK", id: "📨 KIRIM FEEDBACK" }, upd: { en: "✏️ UPDATE FEEDBACK", id: "✏️ PERBARUI FEEDBACK" },
  sending: { en: "Sending...", id: "Mengirim..." }, sent: { en: "Sent! Thank you 🎉", id: "Terkirim! Terima kasih 🎉" },
  answerAll: { en: "Please answer every question first.", id: "Jawab semua pertanyaan dulu ya." },
  tooShort: { en: "Write a little more please (at least 5 letters).", id: "Tulis sedikit lebih lengkap ya (minimal 5 huruf)." },
  failSend: { en: "Not sent. Check your internet and try again.", id: "Belum terkirim. Periksa internet lalu coba lagi." },
  leave: { en: "Your feedback isn't sent yet. Leave anyway?", id: "Feedback-mu belum dikirim. Tetap kembali?" },
  typeHere: { en: "Write your answer here...", id: "Tulis jawabanmu di sini..." }, noFs: { en: "Fullscreen isn't supported on this device. Use ↗ to open in a new tab.", id: "Layar penuh tidak didukung di perangkat ini. Pakai tombol ↗ untuk membuka di tab baru." },
  defQ: { en: "Write 1 specific and kind suggestion to help your friend improve their project.", id: "Tulis 1 saran yang spesifik dan sopan supaya project temanmu makin baik." }
};
const T = k => UI[k][lang] || UI[k].en;
const tx = o => !o ? "" : (typeof o === "string" ? o : (lang === "id" && o.id ? o.id : (o.en || o.id || "")));

const shell = inner => {
  app.innerHTML = `<header><b>💬 ${esc(T("title"))}</b><a class="btn lo" style="padding:4px 12px;font-size:15px" href="student.html?lesson=${encodeURIComponent(LID)}">${esc(T("back"))}</a><button class="idt${lang === "id" ? " on" : ""}" id="lg" type="button">${lang === "id" ? "ID ✓" : "ID"}</button></header><main>${inner}</main>`;
  document.getElementById("lg").onclick = () => { lang = lang === "id" ? "en" : "id"; localStorage.setItem("robotLang", lang); if (view) view(); };
};
const classes = () => { const a = []; SU.projects.forEach(p => { if (!a.includes(p.cls)) a.push(p.cls); }); return a; };
const inCls = c => SU.projects.filter(p => p.cls === c);
const find = (c, n) => SU.projects.find(p => p.cls === c && String(p.no) === String(n));
const opts = (c, selNo, forGive) => inCls(c).map(p => {
  const me = ME && p.cls === ME.cls && String(p.no) === String(ME.no), done = forGive && GIVEN[K(p.cls, p.no)];
  return `<option value="${esc(p.no)}"${String(p.no) === String(selNo) ? " selected" : ""}${me && forGive ? " disabled" : ""}>${esc(p.no)}. ${esc(p.name)}${me && forGive ? " " + T("you") : ""}${done ? " ✓" : ""}</option>`;
}).join("");
const questions = () => (CH && CH.questions && CH.questions.length) ? CH.questions : [{ type: "text", q: UI.defQ }];

async function init() {
  if (!LID) { shell(`<div class="card"><h2>Invalid link</h2></div>`); return; }
  shell(`<div class="card empty"><h1>⏳</h1>${esc(T("loading"))}</div>`);
  const cached = readJ("lesson_" + LID);
  const [rs, rl] = await Promise.all([apiGet("getFbSetup", { id: LID }).catch(() => null), apiGet("getLesson", { id: LID }).catch(() => null)]);
  if (rs && rs.ok) { SU = rs.setup; writeJ("fbSetup_" + LID, SU); } else SU = readJ("fbSetup_" + LID);
  L = rl && rl.ok ? rl.lesson : cached;
  CH = L && (L.challenges || []).find(c => c.type === "feedback") || null;
  if (!SU) { view = null; shell(`<div class="card"><h2>${esc(T("notOpen"))}</h2><p>${esc(T("notOpen2"))}</p></div>`); return; }
  if (ME && !find(ME.cls, ME.no)) { ME = null; localStorage.removeItem("fbMe_" + LID); }
  ME ? showHome() : showWho();
}

function showWho() {
  view = showWho; const cl = classes();
  shell(`<div class="card"><h1>${esc(T("hello"))}</h1><p>${esc(T("pickWho"))}</p>
    <label class="l">${esc(T("cls"))}</label><select id="k"><option value="">${esc(T("selCls"))}</option>${cl.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <label class="l">${esc(T("nm"))}</label><select id="n" disabled><option value="">${esc(T("selNm"))}</option></select>
    <button class="go" id="go">${esc(T("start"))}</button></div>`);
  const k = document.getElementById("k"), n = document.getElementById("n");
  k.onchange = () => { n.disabled = !k.value; n.innerHTML = `<option value="">${esc(T("selNm"))}</option>` + (k.value ? opts(k.value, "", false) : ""); };
  document.getElementById("go").onclick = () => {
    if (!k.value || !n.value) { alert(T("fillWho")); return; }
    ME = { cls: k.value, no: n.value }; writeJ("fbMe_" + LID, ME); pickCls = ""; showHome();
  };
}

function showHome() {
  view = showHome; const me = find(ME.cls, ME.no); pickCls = pickCls || ME.cls;
  shell(`<div class="card"><h1>${esc(T("hi"))}, ${esc(me.name)}! 👋</h1><div>${esc((L && L.title) || SU.title || "")} • ${esc(me.cls)} • No ${esc(me.no)}</div>
    <button class="lo" id="sw" style="margin-top:10px">${esc(T("notMe"))}</button></div>
    <div class="tabs"><button id="t1" class="${tab === "give" ? "on" : ""}">${esc(T("tGive"))}</button><button id="t2" class="${tab === "mine" ? "on" : ""}">${esc(T("tMine"))}</button></div><div id="body"></div>`);
  document.getElementById("sw").onclick = () => { ME = null; localStorage.removeItem("fbMe_" + LID); showWho(); };
  document.getElementById("t1").onclick = () => { tab = "give"; showHome(); };
  document.getElementById("t2").onclick = () => { tab = "mine"; showHome(); };
  tab === "give" ? drawGive() : drawMine();
}

function drawGive() {
  const b = document.getElementById("body"), cl = classes();
  b.innerHTML = `<div class="card"><h2>${esc(T("pickProj"))}</h2>
    <label class="l">${esc(T("cls"))}</label><select id="k">${cl.map(c => `<option${c === pickCls ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <label class="l">${esc(T("nm"))}</label><select id="n"><option value="">${esc(T("selNm"))}</option>${opts(pickCls, "", true)}</select>
    <button class="go" id="open" disabled>${esc(T("open"))}</button><p><small>${esc(T("doneNote"))}</small></p></div>`;
  const k = document.getElementById("k"), n = document.getElementById("n"), o = document.getElementById("open");
  k.onchange = () => { pickCls = k.value; n.innerHTML = `<option value="">${esc(T("selNm"))}</option>` + opts(pickCls, "", true); o.disabled = true; };
  n.onchange = () => { o.disabled = !n.value; };
  o.onclick = () => openProject(find(pickCls, n.value));
}

function showAns(a) {
  if (a.t === "rating") return `<div class="st">${"⭐".repeat(Math.max(0, Math.min(5, +a.a || 0)))}</div>`;
  if (a.t === "choice") return `<p>${esc(tx(a.a))}</p>`;
  return `<p>${esc(a.a)}</p>`;
}
async function drawMine() {
  const b = document.getElementById("body");
  b.innerHTML = `<div class="card"><h2>${esc(T("mineTitle"))}</h2><div id="lst" class="empty">⏳ ${esc(T("loading"))}</div><button class="lo" id="rf" style="margin-top:8px">${esc(T("reload"))}</button></div>`;
  document.getElementById("rf").onclick = drawMine;
  const box = document.getElementById("lst");
  try {
    const r = await apiGet("getFbMine", { id: LID, cls: ME.cls, no: ME.no });
    if (!r.ok) throw new Error(r.error);
    box.className = "";
    box.innerHTML = r.items.length ? r.items.map(i => `<div class="fbk"><small>💬 ${esc(i.from || T("friend"))} • ${esc(new Date(i.t).toLocaleDateString(lang === "id" ? "id-ID" : "en-GB", { day: "numeric", month: "short" }))}</small>${
      i.answers && i.answers.length ? i.answers.map(a => `${a.q && (a.q.en || a.q.id) ? `<span class="ql">${esc(tx(a.q))}</span>` : ""}${showAns(a)}`).join("") : `<p>${esc(i.text)}</p>`}</div>`).join("")
      : `<p>${esc(T("none"))}</p>`;
  } catch (e) { box.className = "msg bad"; box.textContent = T("loadErr"); }
}

function openProject(p) {
  view = null;
  const me = find(ME.cls, ME.no), key = K(p.cls, p.no), QS = questions(), prev = GIVEN[key];
  const A = {};
  if (typeof prev === "string") { const j0 = QS.findIndex(q => q.type === "text"); if (j0 >= 0) A[j0] = prev; }
  else if (Array.isArray(prev)) prev.forEach((v, j) => { if (v != null && QS[j]) A[j] = v; });
  const stage = p.pid
    ? `<iframe src="https://scratch.mit.edu/projects/${esc(p.pid)}/embed" allowfullscreen allow="fullscreen; autoplay" loading="eager"></iframe>`
    : p.url ? `<div class="nop"><h2>${esc(T("noEmbed"))}</h2><p>${esc(T("noEmbed2"))}</p><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(T("openProj"))}</a></div>`
      : `<div class="nop"><h2>${esc(p.name)} ${esc(T("noSub"))}</h2><p>${esc(T("pickOther"))}</p></div>`;
  const form = QS.map((q, j) => `<div data-j="${j}"><label class="ql">${esc(tx(q.q))}</label>${
    q.type === "rating" ? `<div class="stars">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-v="${v}">★</button>`).join("")}</div>`
      : q.type === "choice" ? `<div class="chs">${(q.options || []).map((o, k) => `<button type="button" data-v="${k}">${esc(tx(o))}</button>`).join("")}</div>`
        : `<textarea maxlength="600" placeholder="${esc(T("typeHere"))}">${esc(A[j] || "")}</textarea>`}</div>`).join("");
  const had = prev != null;
  app.innerHTML = `<div class="vw"><div class="vt"><button id="bk">←</button><b>${esc(p.no)}. ${esc(p.name)} • ${esc(p.cls)}</b>
      ${p.pid ? `<button class="alt" id="fs">${esc(T("full"))}</button><a class="btn alt" href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(T("newtab"))}">↗</a>` : ""}<button class="mob" id="tg">💬</button></div>
    <div class="vb"><div class="stage" id="stage">${stage}</div>
    <aside class="pn" id="pn"><h2 style="font-size:20px">${esc(T("fbFor"))} ${esc(p.name)}</h2>${CH && tx(CH.prompt) ? `<p>${esc(tx(CH.prompt))}</p>` : ""}
      ${form}<div class="msg" id="st"></div><button class="go" id="send">${esc(had ? T("upd") : T("send"))}</button></aside></div></div>`;
  const st = document.getElementById("st"), btn = document.getElementById("send"), pn = document.getElementById("pn");
  const paint = () => pn.querySelectorAll("[data-j]").forEach(w => {
    const j = +w.dataset.j, q = QS[j];
    if (q.type === "rating") w.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= (A[j] || 0)));
    if (q.type === "choice") w.querySelectorAll("button").forEach(x => x.classList.toggle("on", A[j] != null && +x.dataset.v === A[j]));
  });
  pn.querySelectorAll("[data-j]").forEach(w => {
    const j = +w.dataset.j, q = QS[j];
    if (q.type === "text") w.querySelector("textarea").oninput = e => { A[j] = e.target.value; };
    else w.querySelectorAll("button").forEach(x => x.onclick = () => { A[j] = +x.dataset.v; paint(); });
  });
  paint();
  let sentSig = JSON.stringify(QS.map((q, j) => A[j] == null ? null : A[j])), dirty = () => JSON.stringify(QS.map((q, j) => A[j] == null ? null : A[j])) !== sentSig && Object.keys(A).some(k => String(A[k] || "").trim());
  document.getElementById("bk").onclick = () => { if (dirty() && !confirm(T("leave"))) return; showHome(); };
  const fs = document.getElementById("fs");
  if (fs) fs.onclick = () => { const s = document.getElementById("stage"); (s.requestFullscreen || s.webkitRequestFullscreen || function () { alert(T("noFs")); }).call(s); };
  const tg = document.getElementById("tg"); if (tg) tg.onclick = () => pn.classList.toggle("min");
  btn.onclick = async () => {
    for (let j = 0; j < QS.length; j++) {
      const q = QS[j], v = A[j];
      if (q.type === "text") { if (!String(v || "").trim()) { st.className = "msg bad"; st.textContent = T("answerAll"); return; } if (String(v).trim().length < 5) { st.className = "msg bad"; st.textContent = T("tooShort"); return; } }
      else if (v == null || v === 0) { st.className = "msg bad"; st.textContent = T("answerAll"); return; }
    }
    const answers = QS.map((q, j) => q.type === "rating" ? { t: "rating", q: q.q, a: A[j] } : q.type === "choice" ? { t: "choice", q: q.q, a: q.options[A[j]] } : { t: "text", q: q.q, a: String(A[j]).trim() });
    btn.disabled = true; st.className = "msg"; st.textContent = T("sending");
    let r = null;
    for (let i = 0; i < 3 && !(r && r.ok); i++) {
      try { r = await api("sendFeedback", { lessonId: LID, from: { cls: me.cls, no: me.no, name: me.name }, to: { cls: p.cls, no: p.no, name: p.name }, answers }); if (r && r.ok === false && r.error) break; }
      catch (e) { await new Promise(ok => setTimeout(ok, 1500 * (i + 1))); }
    }
    btn.disabled = false;
    if (r && r.ok) { GIVEN[key] = QS.map((q, j) => A[j] == null ? null : A[j]); writeJ("fbGiven_" + LID, GIVEN); sentSig = JSON.stringify(GIVEN[key]); st.className = "msg good"; st.textContent = T("sent"); btn.textContent = T("upd"); confetti(); }
