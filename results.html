<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasil Murid</title>
<style>
:root{--o:#E8832A;--g:#3FA535;--b:#1B4F9C;--n:#0F2F6B}
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f7fd;margin:0;color:var(--n)}
.top{display:flex;gap:12px;align-items:center;padding:10px 20px;background:#fff;border-bottom:4px solid var(--o)}.top h2{flex:1;margin:0}.top a{color:var(--b);font-weight:700;text-decoration:none}
.w{max-width:1000px;margin:0 auto;padding:16px}.c{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0f2f6b14}
select,button{padding:8px 12px;border:2px solid #cfdcf3;border-radius:8px;font:inherit;background:#fff}button{background:var(--b);color:#fff;border:0;font-weight:700;cursor:pointer}.g{background:var(--g)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e3eaf7;text-align:left;vertical-align:top}th{background:#eef3fc}
.bar{height:10px;background:#e6edfa;border-radius:6px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--g)}.low i{background:#e0483e}
details{font-size:13px}.ok{color:var(--g);font-weight:700}.no{color:#d03a30;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="top"><a href="admin.html">← Kembali</a><h2>📊 Hasil Murid</h2><button class="g" id="reload">Muat ulang</button></div>
<div class="w">
  <div class="c row"><label>Lesson: <select id="fl"></select></label><label>Kelas: <select id="fc"></select></label>
    <button id="e1">⬇ Rekap siswa (CSV)</button><button id="e2">⬇ Semua jawaban (CSV)</button><a href="#" id="sh" target="_blank">Buka Google Sheet</a></div>
  <div class="c"><h3>Rekap per siswa</h3><p style="font-size:13px;opacity:.7">Nilai = % benar dari soal yang dinilai (pakai jawaban terakhir tiap soal). Klik "lihat" untuk melihat jawaban per soal.</p><div id="t1">Memuat…</div></div>
  <div class="c"><h3>Analisis per soal</h3><p style="font-size:13px;opacity:.7">Soal dengan % benar rendah (merah) = materi yang perlu diulang.</p><div id="t2"></div></div>
</div>
<script src="api.js"></script>
<script src="translate.js"></script>
<script>
const $ = id => document.getElementById(id), esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let rows = [], rec = [], raw = [];
$("sh").href = SHEET_URL;
async function load() {
  const key = adminKey(); if (!key) return;
  $("t1").textContent = "Memuat…";
  try {
    const r = await api("getResults", { key });
    if (!r.ok) throw new Error(r.error || "Gagal (deploy ulang Apps Script?)");
    sessionStorage.setItem("adminKey", key);
    rows = r.rows.map(a => ({ t: a[0], lid: a[1], lesson: a[2], name: a[3], cls: a[4], ch: a[5], no: a[6], q: a[7], a: a[8], st: a[9], sc: a[10] }));
    const want = new URLSearchParams(location.search).get("lesson"), ls = {};
    rows.forEach(x => ls[x.lid] = x.lesson);
    $("fl").innerHTML = Object.keys(ls).map(k => `<option value="${esc(k)}" ${k === want ? "selected" : ""}>${esc(ls[k])}</option>`).join("") || "<option value=''>(belum ada data)</option>";
    fillCls(); draw();
  } catch (e) { $("t1").textContent = "Gagal memuat: " + e.message; }
}
function fillCls() {
  const cs = [...new Set(rows.filter(x => x.lid === $("fl").value).map(x => x.cls))].sort();
  $("fc").innerHTML = "<option value=''>Semua kelas</option>" + cs.map(c => `<option>${esc(c)}</option>`).join("");
}
function draw() {
  raw = rows.filter(x => x.lid === $("fl").value && (!$("fc").value || x.cls === $("fc").value));
  const last = new Map(); raw.forEach(x => last.set([x.name, x.cls, x.ch, x.no, x.q].join("|"), x)); rec = [...last.values()];
  const stu = {}; rec.forEach(x => { const k = x.name + "|" + x.cls; (stu[k] = stu[k] || { name: x.name, cls: x.cls, items: [] }).items.push(x); });
  const S = Object.values(stu).map(s => {
    const g = s.items.filter(x => x.st === "benar" || x.st === "salah"), ok = g.filter(x => x.st === "benar").length;
    return Object.assign(s, { graded: g.length, ok, pct: g.length ? Math.round(ok / g.length * 100) : null, games: s.items.filter(x => x.st === "selesai").length, total: s.items.filter(x => x.st !== "selesai").length });
  }).sort((a, b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name));
  $("t1").innerHTML = S.length ? `<table><tr><th>Nama</th><th>Kelas</th><th>Soal dijawab</th><th>Benar</th><th>Nilai</th><th>Level game selesai</th><th>Jawaban</th></tr>${S.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td>${s.total}</td><td>${s.ok}/${s.graded}</td><td><b>${s.pct == null ? "-" : s.pct}</b></td><td>${s.games}</td><td><details><summary>lihat</summary>${s.items.map(x => `<div>${esc(x.ch)} #${esc(x.no)}: ${esc(x.q)} → <i>${esc(x.a)}</i> <span class="${x.st === "benar" ? "ok" : x.st === "salah" ? "no" : ""}">${esc(x.st)}</span></div>`).join("")}</details></td></tr>`).join("")}</table>` : "Belum ada data.";
  const qs = {}; rec.filter(x => x.st !== "selesai").forEach(x => { const k = x.ch + "|" + x.no + "|" + x.q; (qs[k] = qs[k] || { ch: x.ch, no: +x.no, q: x.q, n: 0, g: 0, ok: 0 }).n++; if (x.st === "benar" || x.st === "salah") { qs[k].g++; if (x.st === "benar") qs[k].ok++; } });
  const Q = Object.values(qs).sort((a, b) => a.ch.localeCompare(b.ch) || a.no - b.no);
  $("t2").innerHTML = Q.length ? `<table><tr><th>Challenge</th><th>No</th><th>Soal</th><th>Menjawab</th><th>% benar</th></tr>${Q.map(q => { const p = q.g ? Math.round(q.ok / q.g * 100) : null; return `<tr><td>${esc(q.ch)}</td><td>${q.no}</td><td>${esc(q.q)}</td><td>${q.n}</td><td>${p == null ? "tidak dinilai" : `${p}%<div class="bar ${p < 50 ? "low" : ""}"><i style="width:${p}%"></i></div>`}</td></tr>`; }).join("")}</table>` : "Belum ada data soal.";
  draw.S = S;
}
function csv(a, name) {
  const t = "\ufeff" + a.map(r => r.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); l.download = name; l.click();
}
$("fl").onchange = () => { fillCls(); draw(); }; $("fc").onchange = draw; $("reload").onclick = load;
$("e1").onclick = () => csv([["Nama", "Kelas", "Soal dijawab", "Benar", "Dinilai", "Nilai (%)", "Level game selesai"]].concat((draw.S || []).map(s => [s.name, s.cls, s.total, s.ok, s.graded, s.pct == null ? "" : s.pct, s.games])), "rekap-siswa.csv");
$("e2").onclick = () => csv([["Waktu", "Nama", "Kelas", "Challenge", "No", "Pertanyaan", "Jawaban", "Status", "Skor"]].concat(raw.map(x => [x.t, x.name, x.cls, x.ch, x.no, x.q, x.a, x.st, x.sc])), "semua-jawaban.csv");
load();
</script>
</body>
</html>
