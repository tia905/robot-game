<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenges</title>
<style>
body{font-family:system-ui,sans-serif;background:#eef4ff;margin:0;color:#222}
.w{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.c,.q{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
.q{background:#f6f8ff;box-shadow:none}
.h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.h input{flex:1}
input[type=text],textarea{box-sizing:border-box;padding:8px;border:2px solid #cfd8ee;border-radius:8px;font:inherit}
textarea{width:100%}
button{padding:8px 12px;border:0;border-radius:8px;background:#3b6fe0;color:#fff;font-weight:700;cursor:pointer}
.opt{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.opt input[type=text]{flex:1;min-width:140px}
img{max-height:70px;border-radius:6px}
.add{display:flex;gap:8px}
a{color:#3b6fe0;font-weight:700}
</style>
</head>
<body>
<div class="w">
  <div class="top"><a href="admin.html">← Kembali</a><h2 id="t"></h2><button id="save">SIMPAN</button></div>
  <div id="list"></div>
  <div class="add"><button data-a="addgame">+ Game</button><button data-a="addquiz">+ Kuis / Exit Ticket</button></div>
</div>
<script src="api.js"></script>
<script>
const id = new URLSearchParams(location.search).get("lesson");
const lessons = JSON.parse(localStorage.getItem("robotLessons")) || [];
const L = lessons.find(x => String(x.id) === id);
if (!L) { alert("Lesson tidak ditemukan"); location.href = "admin.html"; }
L.challenges = (L.challenges || [{ type: "game", title: "Game" }]).filter(c => c.type === "game" || c.type === "quiz");
const C = L.challenges, list = document.getElementById("list");
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const newQ = () => ({ q: "", img: "", options: [{ text: "" }, { text: "" }], correct: null });
const at = (i, j, k) => `data-i="${i}" data-j="${j}" data-k="${k}"`;

function render() {
  document.getElementById("t").textContent = L.title;
  list.innerHTML = C.map((c, i) => `<div class="c"><div class="h"><b>${i + 1}. ${c.type === "game" ? "🎮" : "❓"}</b>
    <input type="text" data-f="title" ${at(i, 0, 0)} value="${esc(c.title)}">
    <button data-a="up" ${at(i, 0, 0)}>↑</button><button data-a="dn" ${at(i, 0, 0)}>↓</button><button data-a="del" ${at(i, 0, 0)}>Hapus</button></div>` +
    (c.type === "game" ? "<p>Murid memainkan level yang kamu buat di Level Editor.</p>"
      : c.questions.map((q, j) => `<div class="q"><div class="h"><b>Soal ${j + 1}</b><button data-a="delq" ${at(i, j, 0)}>Hapus soal</button></div>
        <textarea rows="2" data-f="q" ${at(i, j, 0)} placeholder="Teks pertanyaan">${esc(q.q)}</textarea>
        <div class="opt">Gambar soal: <input type="file" accept="image/*" data-f="qimg" ${at(i, j, 0)}>${q.img ? `<img src="${esc(q.img)}">` : ""}</div>` +
        q.options.map((o, k) => `<div class="opt"><label><input type="radio" name="r${i}_${j}" data-f="correct" ${at(i, j, k)} ${q.correct === k ? "checked" : ""}> benar</label>
          <input type="text" data-f="otext" ${at(i, j, k)} value="${esc(o.text)}" placeholder="Teks opsi ${k + 1}">
          <input type="file" accept="image/*" data-f="oimg" ${at(i, j, k)}>${o.img ? `<img src="${esc(o.img)}">` : ""}
          <button data-a="delo" ${at(i, j, k)}>×</button></div>`).join("") +
        `<button data-a="addo" ${at(i, j, 0)}>+ Opsi</button></div>`).join("") +
      `<button data-a="addq" ${at(i, 0, 0)}>+ Soal</button>`) + "</div>").join("");
}

list.addEventListener("input", e => {
  const t = e.target, f = t.dataset.f;
  if (!f || t.type === "file") return;
  const c = C[t.dataset.i], q = c.questions && c.questions[t.dataset.j], k = +t.dataset.k;
  if (f === "title") c.title = t.value;
  if (f === "q") q.q = t.value;
  if (f === "otext") q.options[k].text = t.value;
  if (f === "correct") q.correct = k;
});

list.addEventListener("change", async e => {
  const t = e.target, f = t.dataset.f;
  if ((f !== "qimg" && f !== "oimg") || !t.files[0]) return;
  const url = await upload(t.files[0]);
  if (!url) return;
  const q = C[t.dataset.i].questions[t.dataset.j];
  if (f === "qimg") q.img = url; else q.options[+t.dataset.k].img = url;
  render();
});

document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, i = +b.dataset.i, j = +b.dataset.j, k = +b.dataset.k;
  if (a === "addgame") { if (C.some(c => c.type === "game")) return alert("Game hanya bisa ditambah satu kali."); C.push({ type: "game", title: "Game" }); }
  if (a === "addquiz") C.push({ type: "quiz", title: "Kuis", questions: [newQ()] });
  if (a === "up" && i > 0) C.splice(i - 1, 0, C.splice(i, 1)[0]);
  if (a === "dn" && i < C.length - 1) C.splice(i + 1, 0, C.splice(i, 1)[0]);
  if (a === "del" && confirm("Hapus challenge ini?")) C.splice(i, 1);
  if (a === "addq") C[i].questions.push(newQ());
  if (a === "delq" && confirm("Hapus soal ini?")) C[i].questions.splice(j, 1);
  if (a === "addo") C[i].questions[j].options.push({ text: "" });
  if (a === "delo") { const q = C[i].questions[j]; q.options.splice(k, 1); q.correct = q.correct === k ? null : (q.correct > k ? q.correct - 1 : q.correct); }
  render();
});

document.getElementById("save").onclick = () => {
  for (const c of C) if (c.type === "quiz") for (const q of c.questions) {
    if (!q.q.trim() && !q.img) return alert('Ada soal di "' + c.title + '" yang masih kosong.');
    if (q.options.length < 2 || q.correct == null) return alert('Soal di "' + c.title + '" perlu minimal 2 opsi dan satu jawaban benar.');
  }
  localStorage.setItem("robotLessons", JSON.stringify(lessons));
  alert("Tersimpan. Klik PUBLISH / RE-PUBLISH di dashboard supaya murid melihat perubahan.");
};

async function upload(file) {
  const key = sessionStorage.getItem("adminKey") || prompt("Masukkan kunci admin:");
  if (!key) return null;
  const data = await shrink(file);
  try {
    const r = await api("upload", { key: key, data: data, name: file.name });
    if (!r.ok) throw new Error(r.error);
    sessionStorage.setItem("adminKey", key);
    return r.url;
  } catch (e) { alert("Gagal upload: " + e.message); return null; }
}

function shrink(file) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = im.width * s; c.height = im.height * s;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    im.src = URL.createObjectURL(file);
  });
}
render();
</script>
</body>
</html>
